[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-demo"
version = "0.1.0"
description = "Release Metadata API for a DevSecOps CI/CD portfolio"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx2>=2,<3",
    "ruff>=0.11,<1",
    "pip-tools>=7,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
