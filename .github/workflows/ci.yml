name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Lint Python
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Bandit security scan
        run: python -m bandit -r src

      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Audit development dependencies
        run: python -m pip_audit -r requirements-dev.txt
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"

          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -

          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/gitleaks" version

      - name: Scan Git history for secrets
        run: gitleaks git --redact=100 --log-opts="--all" --no-banner .

      - name: Install Semgrep
        run: |
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --only-binary=:all: "semgrep==1.180.0"
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version

      - name: Validate Semgrep rules
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --metrics=off --validate --config .semgrep/python-security.yml

      - name: Semgrep security scan
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan --metrics=off --config .semgrep/python-security.yml --error src

  container:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --platform linux/amd64 --progress=plain --tag devsecops-secure-pipeline:ci .
      - name: Smoke test Docker container
        run: |
          docker run --detach \
            --name devsecops-ci-smoke \
            --publish 127.0.0.1:18000:8000 \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            devsecops-secure-pipeline:ci

          trap 'docker rm --force devsecops-ci-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in {1..20}; do
            if response="$(curl --fail --silent http://127.0.0.1:18000/health)"; then
              if [ "$response" = '{"status":"ok"}' ]; then
                echo "Docker smoke test passed: $response"
                exit 0
              fi

              echo "Unexpected health response: $response" >&2
              exit 1
            fi

            sleep 1
          done

          echo "Docker smoke test failed: /health is unavailable" >&2
          docker logs devsecops-ci-smoke || true
          exit 1
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.75.0"
          TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"

          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check -

          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          chmod +x "$RUNNER_TEMP/trivy"

          "$RUNNER_TEMP/trivy" --version

      - name: Trivy HIGH and CRITICAL report
        run: |
          "$RUNNER_TEMP/trivy" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            devsecops-secure-pipeline:ci

      - name: Trivy fixable vulnerability gate
        run: |
          "$RUNNER_TEMP/trivy" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            devsecops-secure-pipeline:ci
      - name: Install Syft
        env:
          SYFT_VERSION: "1.54.1"
          SYFT_SHA256: "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47"
        run: |
          archive="$RUNNER_TEMP/syft.tar.gz"

          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"

          printf '%s  %s\n' "$SYFT_SHA256" "$archive" | sha256sum --check -

          tar -xzf "$archive" -C "$RUNNER_TEMP" syft
          chmod +x "$RUNNER_TEMP/syft"

          "$RUNNER_TEMP/syft" version

      - name: Generate and validate CycloneDX SBOM
        run: |
          "$RUNNER_TEMP/syft" "docker:devsecops-secure-pipeline:ci" \
            --output "cyclonedx-json=$RUNNER_TEMP/devsecops-secure-pipeline.cdx.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "devsecops-secure-pipeline.cdx.json"
          sbom = json.loads(path.read_text(encoding="utf-8"))

          if sbom.get("bomFormat") != "CycloneDX":
              raise SystemExit("Invalid CycloneDX BOM format")

          components = sbom.get("components")
          if not isinstance(components, list) or not components:
              raise SystemExit("SBOM contains no components")

          metadata = sbom.get("metadata", {}).get("component", {})
          if metadata.get("type") != "container":
              raise SystemExit("SBOM target is not identified as a container")

          names = {item.get("name") for item in components if isinstance(item, dict)}
          missing = {"fastapi", "uvicorn"} - names

          if missing:
              raise SystemExit(f"Missing application components: {sorted(missing)}")

          print(f"CycloneDX SBOM validated: {len(components)} components")
          PY
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-sbom-cyclonedx
          path: ${{ runner.temp }}/devsecops-secure-pipeline.cdx.json
          if-no-files-found: error
          retention-days: 7
      - name: Export scanned Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image_dir="$RUNNER_TEMP/container-image"
          mkdir -p "$image_dir"

          docker save \
            --output "$image_dir/image.tar" \
            devsecops-secure-pipeline:ci

          (
            cd "$image_dir"
            sha256sum image.tar > image.tar.sha256
            sha256sum --check image.tar.sha256
          )

      - name: Upload scanned Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanned-container-image
          path: ${{ runner.temp }}/container-image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish:
    name: Publish Docker image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Iyed523/devsecops-secure-pipeline'
    needs: [quality, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scanned-container-image
          path: ${{ runner.temp }}/container-image

      - name: Verify and load scanned Docker image
        run: |
          cd "$RUNNER_TEMP/container-image"
          sha256sum --check image.tar.sha256

          docker load --input image.tar
          docker image inspect devsecops-secure-pipeline:ci > /dev/null
      - name: Require existing private GHCR package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          response="$RUNNER_TEMP/ghcr-packages.json"

          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --get \
            --data-urlencode "package_type=container" \
            --data-urlencode "visibility=private" \
            --data-urlencode "per_page=100" \
            --output "$response" \
            "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/packages"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "ghcr-packages.json"
          packages = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(packages, list):
              raise SystemExit("Unexpected GitHub Packages API response")

          matches = [
              package
              for package in packages
              if isinstance(package, dict)
              and package.get("name") == "devsecops-secure-pipeline"
              and package.get("package_type") == "container"
              and package.get("visibility") == "private"
              and package.get("owner", {}).get("login", "").lower()
                  == os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "GHCR publication blocked: existing private package "
                  "not found or not accessible"
              )

          print("GHCR preflight passed: existing private package verified")
          PY
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push scanned image to GHCR
        env:
          IMAGE_NAME: ghcr.io/iyed523/devsecops-secure-pipeline
        run: |
          tag="sha-${GITHUB_SHA}"

          docker tag devsecops-secure-pipeline:ci "${IMAGE_NAME}:${tag}"
          docker push "${IMAGE_NAME}:${tag}"

          echo "Published: ${IMAGE_NAME}:${tag}"
