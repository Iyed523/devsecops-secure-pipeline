name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Lint Python
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Bandit security scan
        run: python -m bandit -r src

      - name: Audit application dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Audit development dependencies
        run: python -m pip_audit -r requirements-dev.txt
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"

          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -

          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

          "$RUNNER_TEMP/gitleaks" version

      - name: Scan Git history for secrets
        run: gitleaks git --redact=100 --log-opts="--all" --no-banner .
