
name: GHCR Private Package Access Test

on:
  push:
    branches:
      - test/ghcr-private-preflight

permissions:
  contents: read
  packages: read

jobs:
  check-private-package:
    name: Verify GHCR registry access
    if: github.repository == 'Iyed523/devsecops-secure-pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check anonymous access is denied
        run: |
          set -euo pipefail

          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-anonymous"
          mkdir -p "$DOCKER_CONFIG"

          image="ghcr.io/iyed523/devsecops-secure-pipeline:bootstrap-128dfc8"
          log="$RUNNER_TEMP/anonymous-pull.log"

          if docker pull "$image" > "$log" 2>&1; then
            echo "SECURITY FAILURE: anonymous image pull succeeded" >&2
            exit 1
          fi

          if ! grep -Eiq \
            'denied|unauthorized|authentication required|insufficient_scope|forbidden|401|403' \
            "$log"; then
            echo "Anonymous pull failed for an unexpected reason:" >&2
            sed -n '1,15p' "$log" >&2
            exit 1
          fi

          echo "Anonymous GHCR pull was denied as expected"

      - name: Verify authenticated image access
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-authenticated"
          mkdir -p "$DOCKER_CONFIG"

          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

          image="ghcr.io/iyed523/devsecops-secure-pipeline:bootstrap-128dfc8"

          docker pull "$image"
          docker image inspect "$image" > /dev/null

          echo "GITHUB_TOKEN can retrieve the GHCR image"
